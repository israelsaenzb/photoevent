<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería en Vivo - Festival Guelaguetza</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background-color: #2d142c;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #e81e63;
        }
        header h2 {
            margin: 0;
            font-size: 1.2rem;
            color: #f7b731;
        }
        .btn-volver {
            color: white;
            text-decoration: none;
            background-color: #e81e63;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: bold;
        }
        .galeria-container {
            flex: 1;
            padding: 15px;
            max-width: 1000px;
            width: 100%;
            margin: 0 auto;
            box-sizing: border-box;
        }
        iframe {
            width: 100%;
            height: 75vh;
            border: none;
            border-radius: 12px;
            background-color: #ffffff;
        }
        .nota {
            text-align: center;
            font-size: 0.85rem;
            color: #aaaaaa;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h2>📸 Álbum del Festival</h2>
        <a href="index.html" class="btn-volver">← Regresar</a>
    </header>

    <div class="galeria-container">
        <iframe src="https://google.com"></iframe>
        <p class="nota">¿Acabas de subir una foto? Actualiza la página para verla aquí.</p>
    </div>

</body>
</html>
